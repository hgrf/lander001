name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up patched tray-item dependency
        run: ./scripts/setup_tray_item.sh

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-quality-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-quality-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check formatting of firmware crate
        run: cargo fmt --manifest-path fw/Cargo.toml --check

      - name: Check formattting of host GUI crate
        run: cargo fmt --manifest-path landerctl/Cargo.toml --check

      - name: Lint host GUI crate
        run: cargo clippy --manifest-path landerctl/Cargo.toml --all-targets -- -D warnings

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up patched tray-item dependency
        run: ./scripts/setup_tray_item.sh

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-appimage-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-appimage-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            pkg-config \
            file \
            patchelf \
            desktop-file-utils \
            imagemagick \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --manifest-path landerctl/Cargo.toml

      - name: Cache AppImage tools
        id: cache-appimage-tools
        uses: actions/cache@v4
        with:
          path: |
            linuxdeploy.AppImage
            appimagetool.AppImage
          key: appimage-tools-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Download AppImage tooling
        if: steps.cache-appimage-tools.outputs.cache-hit != 'true'
        run: |
          curl -L -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy.AppImage appimagetool.AppImage

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/landerctl AppDir/usr/bin/
          convert assets/gui/icon.png -resize 512x512 AppDir/landerctl.png

          cat > AppDir/landerctl.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Landerctl
          Exec=landerctl
          Icon=landerctl
          Categories=Utility;
          Terminal=false
          EOF

      - name: Bundle AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/landerctl.desktop \
            --icon-file AppDir/landerctl.png \
            --executable AppDir/usr/bin/landerctl

          ./appimagetool.AppImage AppDir landerctl-linux-x86_64.AppImage

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: landerctl-linux-x86_64
          path: landerctl-linux-x86_64.AppImage
          if-no-files-found: error

  build-macos-app:
    name: Build macOS App
    runs-on: macos-latest
    needs: quality
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up patched tray-item dependency
        run: ./scripts/setup_tray_item.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --manifest-path landerctl/Cargo.toml

      - name: Assemble .app bundle
        run: |
          APP_ROOT="dist/Landerctl.app"
          mkdir -p "$APP_ROOT/Contents/MacOS" "$APP_ROOT/Contents/Resources"

          cp target/release/landerctl "$APP_ROOT/Contents/MacOS/landerctl"
          cp assets/gui/icon.png "$APP_ROOT/Contents/Resources/icon.png"

          cat > "$APP_ROOT/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Landerctl</string>
            <key>CFBundleDisplayName</key>
            <string>Landerctl</string>
            <key>CFBundleIdentifier</key>
            <string>com.holgergraef.landerctl</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>landerctl</string>
          </dict>
          </plist>
          EOF

      - name: Import macOS signing certificate
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="temporary-ci-password"
          CERT_PATH="$RUNNER_TEMP/codesign-cert.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign app bundle
        run: |
          APP_ROOT="dist/Landerctl.app"
          CODESIGN_IDENTITY="$MACOS_CODESIGN_IDENTITY"

          if [[ -n "$CODESIGN_IDENTITY" ]]; then
            echo "Signing with identity: $CODESIGN_IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "$APP_ROOT"
          else
            echo "No Developer ID identity configured; applying ad-hoc signature"
            codesign --force --deep --sign - "$APP_ROOT"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_ROOT"

      - name: Package app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Landerctl.app" landerctl-macos-app.zip

      - name: Notarize app bundle (optional)
        if: ${{ env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.MACOS_CODESIGN_IDENTITY != '' }}
        run: |
          xcrun notarytool submit "landerctl-macos-app.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "dist/Landerctl.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Landerctl.app" landerctl-macos-app.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: landerctl-macos-app
          path: landerctl-macos-app.zip
          if-no-files-found: error

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache ldproxy binary
        id: cache-ldproxy
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ldproxy
          key: ldproxy-${{ runner.os }}

      - name: Install ldproxy
        if: steps.cache-ldproxy.outputs.cache-hit != 'true'
        run: cargo install ldproxy

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ hashFiles('fw/.cargo/config.toml', 'fw/Cargo.toml') }}
          restore-keys: espressif-

      - name: Set up patched esp-idf-svc dependency
        run: ./scripts/setup_esp_idf_svc.sh

      - name: Build firmware
        run: |
          cd fw
          cargo build --release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lander001-firmware
          path: fw/target/riscv32imc-esp-espidf/release/lander001
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-appimage, build-macos-app, build-firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: landerctl-linux-x86_64

      - name: Download macOS app artifact
        uses: actions/download-artifact@v4
        with:
          name: landerctl-macos-app

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: lander001-firmware

      - name: Rename artifacts with version
        run: |
          mv landerctl-linux-x86_64.AppImage landerctl-${{ github.ref_name }}-linux-x86_64.AppImage
          mv landerctl-macos-app.zip landerctl-${{ github.ref_name }}-macos-app.zip
          mv lander001 lander001-${{ github.ref_name }}-firmware.elf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            landerctl-${{ github.ref_name }}-linux-x86_64.AppImage
            landerctl-${{ github.ref_name }}-macos-app.zip
            lander001-${{ github.ref_name }}-firmware.elf